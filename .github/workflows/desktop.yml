name: Build Tauri desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  media-worker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, arch: x86_64 }
          - { os: macos-15-intel, platform: macos, arch: x86_64 }
          - { os: macos-15, platform: macos, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover -s desktop/tests -v
      - run: python scripts/build-media.py --arch ${{ matrix.arch }}
      - run: python scripts/check-media-package.py
      - shell: bash
        run: tar -cf media-${{ matrix.platform }}-${{ matrix.arch }}.tar -C src-tauri/worker-runtime ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: media-${{ matrix.platform }}-${{ matrix.arch }}
          path: media-*.tar
  desktop:
    needs: media-worker
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { os: macos-15, platform: macos, target: universal-apple-darwin, bundles: 'app,dmg' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/download-artifact@v4
        with:
          pattern: media-${{ matrix.platform }}-*
          merge-multiple: true
          path: artifacts/worker-downloads
      - shell: bash
        run: |
          mkdir -p src-tauri/worker-runtime
          for archive in artifacts/worker-downloads/*.tar; do tar -xf "$archive" -C src-tauri/worker-runtime; done
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm test
      - run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - if: matrix.platform == 'macos'
        run: python3 scripts/check-macos-bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: DT-App-${{ matrix.platform }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.zip
          if-no-files-found: error
